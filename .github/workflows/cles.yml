# À la demande : limite la clé web de Firebase aux adresses de l'appli
name: Clés Firebase
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "voir ou appliquer"
        default: "voir"
jobs:
  cles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POPOTE_2026 }}
          PROJECT: popote-2026
          MODE: ${{ inputs.mode }}
          EN_PLUS: ""
        run: node outils/cles.mjs
