# Publie les règles de sécurité Firestore quand elles changent
name: Règles de sécurité Firestore
on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
  workflow_dispatch:
jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publier les règles
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POPOTE_2026 }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --only firestore:rules --project popote-2026 --non-interactive
