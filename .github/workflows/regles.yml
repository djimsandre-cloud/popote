# Publie les règles de sécurité Firestore quand elles changent
name: Règles de sécurité Firestore
on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
  workflow_dispatch:
jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publier les règles
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POPOTE_2026 }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if ! npx -y firebase-tools@14 deploy --only firestore:rules --project popote-2026 --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1; then
            grep -i -E "error|denied|permission|requires" "$RUNNER_TEMP/out.txt" | head -5 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -3 "$RUNNER_TEMP/out.txt"
