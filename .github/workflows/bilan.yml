# Chaque lundi matin (déposé sur le sujet de collecte, puis réuni dans le bilan de toutes les applis) : bilan de la semaine de Popote & Co envoyé par ntfy
name: Bilan de la semaine
on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:
jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Envoyer le bilan
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POPOTE_2026 }}
          NTFY_TOPIC: bilans-w4lrlmvm6c7xtmdo
        run: node outils/bilan.mjs
